name: price-alerts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check prices
        run: python alerts.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGETS: ${{ secrets.TARGETS }}
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "alerts-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
