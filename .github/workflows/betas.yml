name: betas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run betas
        run: python betas.py
      - name: Save results
        run: |
          if [ -n "$(git status --porcelain betas.json)" ]; then
            git config user.name "alerts-bot"
            git config user.email "bot@users.noreply.github.com"
            git add betas.json
            git commit -m "update betas"
            git push
          fi
